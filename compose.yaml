name: reservas-platform

networks:
  backend-net:
    internal: true
  data-net:
    internal: true

volumes:
  pgdata:

secrets:
  availability_db_password:
    file: secrets/availability_db_password.txt

x-availability-env: &availability-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: availability_db
  DB_USER: availability
  DB_PASSWORD_FILE: /run/secrets/availability_db_password

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD}
      AVAILABILITY_DB_PASSWORD: ${AVAILABILITY_DB_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    init: true
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - data-net
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  availability-migrate:
    build: ./services/availability
    image: availability:local
    command: ["alembic", "upgrade", "head"]
    environment: *availability-env
    secrets:
      - availability_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  availability:
    build: ./services/availability
    image: availability:local
    init: true
    environment: *availability-env
    secrets:
      - availability_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      availability-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  availability-worker:
    build: ./services/availability
    image: availability:local
    init: true
    command: ["python", "-m", "app.infrastructure.workers.expire_holds"]
    environment: *availability-env
    secrets:
      - availability_db_password
    networks:
      - data-net
    depends_on:
      availability-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/heartbeat'; s=int(os.environ.get('EXPIRY_INTERVAL_SECONDS','5'))*3; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=s else 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
