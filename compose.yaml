name: reservas-platform

networks:
  backend-net:
    internal: true
  data-net:
    internal: true

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD}
      AVAILABILITY_DB_PASSWORD: ${AVAILABILITY_DB_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    command: >
      postgres
      -c statement_timeout=15s
      -c lock_timeout=10s
      -c idle_in_transaction_session_timeout=60s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - data-net
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
