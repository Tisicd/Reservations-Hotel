name: reservas-platform

networks:
  edge-net:
  backend-net:
    internal: true
  data-net:
    internal: true

volumes:
  pgdata:

secrets:
  customer_db_password:
    file: secrets/customer_db_password.txt
  hotel_db_password:
    file: secrets/hotel_db_password.txt
  availability_db_password:
    file: secrets/availability_db_password.txt
  payment_db_password:
    file: secrets/payment_db_password.txt
  reservation_db_password:
    file: secrets/reservation_db_password.txt
  notification_db_password:
    file: secrets/notification_db_password.txt

x-customer-env: &customer-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: customer_db
  DB_USER: customer
  DB_PASSWORD_FILE: /run/secrets/customer_db_password

x-hotel-env: &hotel-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: hotel_db
  DB_USER: hotel
  DB_PASSWORD_FILE: /run/secrets/hotel_db_password

x-availability-env: &availability-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: availability_db
  DB_USER: availability
  DB_PASSWORD_FILE: /run/secrets/availability_db_password

x-payment-env: &payment-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: payment_db
  DB_USER: payment
  DB_PASSWORD_FILE: /run/secrets/payment_db_password
  PAYMENT_SIMULATION_ENABLED: "false"
  PROVIDER_TIMEOUT_SECONDS: "3"
  PROVIDER_SLOW_SECONDS: "6"
  RECONCILE_INTERVAL_SECONDS: "5"
  RECONCILE_MIN_AGE_SECONDS: "2"

x-reservation-env: &reservation-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: reservation_db
  DB_USER: reservation
  DB_PASSWORD_FILE: /run/secrets/reservation_db_password
  AVAILABILITY_URL: http://availability:8000
  PAYMENT_URL: http://payment:8000
  CUSTOMER_URL: http://customer:8000
  HOTEL_URL: http://hotel:8000
  NOTIFICATION_URL: http://notification:8000
  NOTIFICATION_READ_TIMEOUT_SECONDS: "3"
  RELAY_INTERVAL_SECONDS: "1"
  RELAY_BATCH: "20"
  RELAY_LEASE_SECONDS: "30"
  SAGA_SYNC_WAIT_SECONDS: "5"
  HOLD_TTL_SECONDS: "600"
  SAGA_HOLD_DEADLINE_SECONDS: "60"
  PAYMENT_MAX_TECHNICAL_RETRIES: "3"
  PAYMENT_RECONCILE_DEADLINE_SECONDS: "900"
  CONFIRM_DEADLINE_SECONDS: "120"
  CANCEL_DEADLINE_SECONDS: "120"
  MANUAL_REVIEW_HOLD_TTL_SECONDS: "86400"
  BACKOFF_BASE_SECONDS: "0.5"
  BACKOFF_MAX_SECONDS: "30"
  LEASE_SECONDS: "15"
  RECOVERY_INTERVAL_SECONDS: "2"
  RECOVERY_BATCH: "20"
  MAX_NIGHTS: "30"

x-notification-env: &notification-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: notification_db
  DB_USER: notification
  DB_PASSWORD_FILE: /run/secrets/notification_db_password
  NOTIFICATION_MAX_ATTEMPTS: "5"
  NOTIFICATION_BACKOFF_BASE_SECONDS: "1"
  NOTIFICATION_BACKOFF_MAX_SECONDS: "30"
  NOTIFICATION_LEASE_SECONDS: "30"
  NOTIFICATION_WORKER_INTERVAL_SECONDS: "1"
  NOTIFICATION_WORKER_BATCH: "20"

services:
  customer-migrate:
    image: customer:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *customer-env
    secrets:
      - customer_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  customer:
    build: ./services/customer
    image: customer:local
    init: true
    environment: *customer-env
    secrets:
      - customer_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  hotel-migrate:
    image: hotel:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *hotel-env
    secrets:
      - hotel_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  hotel:
    build: ./services/hotel
    image: hotel:local
    init: true
    environment: *hotel-env
    secrets:
      - hotel_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      hotel-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      HOTEL_DB_PASSWORD: ${HOTEL_DB_PASSWORD}
      AVAILABILITY_DB_PASSWORD: ${AVAILABILITY_DB_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    init: true
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - data-net
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  availability-migrate:
    image: availability:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *availability-env
    secrets:
      - availability_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  availability:
    build: ./services/availability
    image: availability:local
    init: true
    deploy:
      replicas: 3
    environment: *availability-env
    secrets:
      - availability_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      availability-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  availability-worker:
    image: availability:local
    pull_policy: never
    init: true
    command: ["python", "-m", "app.infrastructure.workers.expire_holds"]
    environment: *availability-env
    secrets:
      - availability_db_password
    networks:
      - data-net
    depends_on:
      availability-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/heartbeat'; s=int(os.environ.get('EXPIRY_INTERVAL_SECONDS','5'))*3; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=s else 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  payment-migrate:
    image: payment:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *payment-env
    secrets:
      - payment_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  payment:
    build: ./services/payment
    image: payment:local
    init: true
    environment: *payment-env
    secrets:
      - payment_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  payment-worker:
    image: payment:local
    pull_policy: never
    init: true
    command: ["python", "-m", "app.infrastructure.workers.reconcile"]
    environment: *payment-env
    secrets:
      - payment_db_password
    networks:
      - data-net
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/heartbeat'; s=int(os.environ.get('RECONCILE_INTERVAL_SECONDS','5'))*3; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=s else 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  reservation-migrate:
    image: reservation:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *reservation-env
    secrets:
      - reservation_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  reservation:
    build: ./services/reservation
    image: reservation:local
    init: true
    environment: *reservation-env
    secrets:
      - reservation_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      reservation-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  reservation-worker:
    image: reservation:local
    pull_policy: never
    init: true
    command: ["python", "-m", "app.infrastructure.workers.reconcile"]
    environment: *reservation-env
    secrets:
      - reservation_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      reservation-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/heartbeat'; s=int(os.environ.get('RECOVERY_INTERVAL_SECONDS','2'))*3; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=s else 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  reservation-relay:
    image: reservation:local
    pull_policy: never
    init: true
    command: ["python", "-m", "app.infrastructure.workers.relay"]
    environment: *reservation-env
    secrets:
      - reservation_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      reservation-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/heartbeat'; s=int(os.environ.get('RELAY_INTERVAL_SECONDS','1'))*3; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=s else 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-migrate:
    image: notification:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: *notification-env
    secrets:
      - notification_db_password
    networks:
      - data-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  notification:
    build: ./services/notification
    image: notification:local
    init: true
    environment: *notification-env
    secrets:
      - notification_db_password
    networks:
      - backend-net
      - data-net
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  notification-worker:
    image: notification:local
    pull_policy: never
    init: true
    command: ["python", "-m", "app.infrastructure.workers.deliver"]
    environment: *notification-env
    secrets:
      - notification_db_password
    networks:
      - data-net
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/heartbeat'; s=int(os.environ.get('NOTIFICATION_WORKER_INTERVAL_SECONDS','1'))*3; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<=s else 1)"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    image: nginx:1.27.4-alpine
    user: "101:101"
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge-net
      - backend-net
    depends_on:
      customer:
        condition: service_healthy
      hotel:
        condition: service_healthy
      availability:
        condition: service_healthy
      reservation:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777
      - /var/run
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s