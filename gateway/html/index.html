<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reservas UCE — demo de reserva de alojamiento">
  <title>Reservas UCE</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Reservas UCE, inicio">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Reservas <strong>UCE</strong></span>
      </a>
      <nav class="mainnav" aria-label="Principal">
        <a href="#/" data-nav="explore">Explorar</a>
        <a href="#/mis-reservas" data-nav="mine">Mis reservas</a>
      </nav>
    </div>
  </header>

  <div id="flash" class="flash" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <p><strong>Reservas UCE</strong> · demo académica · no uses datos reales.</p>
      <button id="demo-toggle" class="ghost" type="button" aria-expanded="false" aria-controls="demo-panel">
        Modo demo técnico
      </button>
    </div>
  </footer>

  <aside id="demo-panel" class="drawer" aria-label="Modo demo técnico" hidden>
    <div class="drawer-head">
      <h2>Modo demo técnico</h2>
      <button id="demo-close" class="icon-btn" type="button" aria-label="Cerrar panel">×</button>
    </div>
    <div id="demo-body" class="drawer-body"></div>
  </aside>
</body>
</html>
