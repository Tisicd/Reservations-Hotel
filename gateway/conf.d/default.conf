upstream customer_upstream { zone customer_upstream 64k; server customer:8000 resolve; }
upstream hotel_upstream { zone hotel_upstream 64k; server hotel:8000 resolve; }
upstream reservation_upstream { zone reservation_upstream 64k; server reservation:8000 resolve; }
upstream payment_upstream { zone payment_upstream 64k; server payment:8000 resolve; }
upstream notification_upstream { zone notification_upstream 64k; server notification:8000 resolve; }
upstream availability_pool {
    zone availability 64k;
    server availability:8000 resolve;
}

proxy_connect_timeout 2s;
proxy_read_timeout 10s;
proxy_send_timeout 10s;
proxy_http_version 1.1;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Cabeceras de seguridad para el frontend (F3).
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
    }

    location /api/availability {
        limit_req zone=api burst=40 nodelay;
        limit_conn conn 20;
        limit_except GET {
            deny all;
        }
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_pass http://availability_pool/availability$is_args$args;
    }

    location /api/reservations {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 10;
        proxy_next_upstream off;
        proxy_pass http://reservation_upstream/reservations;
    }

    location /api/customers {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 10;
        proxy_next_upstream off;
        proxy_pass http://customer_upstream/customers;
    }

    location /api/hotels {
        limit_req zone=api burst=40 nodelay;
        limit_conn conn 20;
        limit_except GET {
            deny all;
        }
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://hotel_upstream/hotels;
    }

    location /api/rooms {
        limit_req zone=api burst=40 nodelay;
        limit_conn conn 20;
        limit_except GET {
            deny all;
        }
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://hotel_upstream/rooms;
    }

    location /api/notifications {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 10;
        limit_except GET {
            deny all;
        }
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://notification_upstream/notifications;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /app.js {
        try_files /app.js =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
    }

    location ^~ /js/ {
        try_files $uri =404;
    }

    location ^~ /img/ {
        try_files $uri =404;
    }

    location = /favicon.ico {
        return 204;
    }
}

server {
    listen 8081;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 '{"status":"ok"}';
    }

    # Carga (F4b): mismas rutas que el publico pero SIN limit_req/limit_conn.
    # Todo el trafico de k6 sale de una IP; medir capacidad exige no tocar
    # los limites por IP. Solo P4 usa el listener publico para observar 429.
    location /api/availability {
        add_header X-Upstream $upstream_addr always;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_pass http://availability_pool/availability$is_args$args;
    }

    location /api/reservations {
        proxy_next_upstream off;
        proxy_pass http://reservation_upstream/reservations;
    }

    location /api/customers {
        proxy_next_upstream off;
        proxy_pass http://customer_upstream/customers;
    }

    location /api/hotels {
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://hotel_upstream/hotels;
    }

    location /api/rooms {
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://hotel_upstream/rooms;
    }

    location /api/notifications {
        limit_except GET {
            deny all;
        }
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://notification_upstream/notifications;
    }

    location /svc/customer/ {
        proxy_next_upstream off;
        proxy_pass http://customer_upstream/;
    }

    location /svc/hotel/ {
        proxy_next_upstream off;
        proxy_pass http://hotel_upstream/;
    }

    location /svc/availability/ {
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_pass http://availability_pool/;
    }

    location /svc/reservation/ {
        proxy_next_upstream off;
        proxy_pass http://reservation_upstream/;
    }

    location /svc/payment/ {
        proxy_next_upstream off;
        proxy_pass http://payment_upstream/;
    }

    location /svc/notification/ {
        proxy_pass http://notification_upstream/;
    }

    location / {
        return 404 '{"error":{"code":"NOT_FOUND","message":"ruta administrativa desconocida"}}';
    }
}

map $http_x_request_id $request_id_header {
    default $http_x_request_id;
    ""      $request_id;
}

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Request-ID $request_id_header;
