name: CI

on:
  push:
  pull_request:

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copiar .env
        run: cp .env.example .env
      - name: Secretos
        run: python scripts/gen_secrets.py
      - name: Lint
        run: make lint
      - name: Up
        run: make up
      - name: Test
        run: make test
      - name: Down
        if: always()
        run: make down
