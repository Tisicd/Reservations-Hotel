networks:
  dev-net:

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5433}:5432"
    networks:
      - dev-net

  availability:
    ports:
      - "127.0.0.1:8101:8000"
    networks:
      - dev-net

  payment:
    ports:
      - "127.0.0.1:8102:8000"
    networks:
      - dev-net
    environment:
      PAYMENT_SIMULATION_ENABLED: "true"

  reservation:
    ports:
      - "127.0.0.1:8103:8000"
    networks:
      - dev-net
