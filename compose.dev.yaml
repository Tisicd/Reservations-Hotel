networks:
  dev-net:

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5433}:5432"
    networks:
      - dev-net

  payment:
    networks:
      - dev-net
    environment:
      PAYMENT_SIMULATION_ENABLED: "true"

  gateway:
    ports: !override
      - "127.0.0.1:${GATEWAY_DEV_PORT:-8088}:8080"
      - "127.0.0.1:8081:8081"
